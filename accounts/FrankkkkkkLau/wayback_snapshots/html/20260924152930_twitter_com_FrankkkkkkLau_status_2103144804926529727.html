  经常看到有人问为什么不推荐用国内邮箱注册海外平台, 分享一下我的想法:
  <br/>
  时不时会收不到验证邮件，可能是被拦截，也有可能是平台主动拉黑了邮箱后缀
  <br/>
  异地登录提醒邮件会暴露账号信息(比如@handle)和落地节点的IP
  <br/>
  某些平台如果不手动设置，会给你推送热门帖子，如果包含敏感词可能会触发邮箱的风控
